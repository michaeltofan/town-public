<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="robots"
      content="noindex,nofollow"
    />
    <meta
      name="description"
      content="TOWN review-only visual harness for community-commitment states. Not part of the product journey."
    />
    <title>TOWN — Community commitment visual review (isolated)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Source+Sans+3:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body class="page-commitment">
    <!--
      REVIEW-ONLY isolated visual harness for the eight Mihail-approved
      commitment states. Not part of the product journey. No API calls.
      Query: ?townReview=commitment-no-country|commitment-country-only|
      commitment-city-no-accept|commitment-accept-pending|commitment-rejected|
      commitment-recorded|commitment-no-acceptance-existing|commitment-restored
      This page does not load script.js and cannot authenticate, commit, or Checkout.
    -->
    <div id="view-commitment">
      <main class="payment" aria-label="Community commitment">
        <div class="payment__frame" id="commitment-frame">
          <p class="payment__brand" aria-label="TOWN">TOWN</p>
          <p class="payment__label" id="commitment-label"></p>
          <h1 class="payment__title" id="commitment-title"></h1>
          <p class="payment__lead" id="commitment-body"></p>

          <fieldset class="commitment__fieldset" id="commitment-country-fieldset">
            <legend class="commitment__legend" id="commitment-country-legend"></legend>
            <div class="commitment__options" id="commitment-country-options">
              <label class="commitment__option">
                <input
                  type="radio"
                  name="commitment-country"
                  value="Italy"
                  id="commitment-country-italy"
                />
                <span id="commitment-country-italy-label">Italy</span>
              </label>
              <label class="commitment__option">
                <input
                  type="radio"
                  name="commitment-country"
                  value="Germany"
                  id="commitment-country-germany"
                />
                <span id="commitment-country-germany-label">Germany</span>
              </label>
              <label class="commitment__option">
                <input
                  type="radio"
                  name="commitment-country"
                  value="Romania"
                  id="commitment-country-romania"
                />
                <span id="commitment-country-romania-label">Romania</span>
              </label>
            </div>
          </fieldset>

          <fieldset class="commitment__fieldset" id="commitment-city-fieldset" disabled>
            <legend class="commitment__legend" id="commitment-city-legend"></legend>
            <div class="commitment__options" id="commitment-city-options"></div>
          </fieldset>

          <div class="commitment__review" id="commitment-review" hidden>
            <h2 class="payment__label" id="commitment-review-label"></h2>
            <p class="payment__status" id="commitment-review-country"></p>
            <p class="payment__status" id="commitment-review-city"></p>
            <p class="payment__note" id="commitment-review-note"></p>
          </div>

          <label class="commitment__accept" id="commitment-accept-label-wrap" hidden>
            <input type="checkbox" id="commitment-accept" />
            <span id="commitment-accept-text"></span>
          </label>
          <p class="payment__note" id="commitment-accept-required" hidden></p>

          <p class="payment__error" id="commitment-error" hidden></p>
          <p class="payment__status" id="commitment-saved-status" hidden></p>
          <p class="payment__note" id="commitment-checkout-hint" hidden></p>

          <div class="payment__actions">
            <button type="button" class="btn btn--primary" id="commitment-confirm" disabled>
              Confirm
            </button>
            <button
              type="button"
              class="btn btn--primary"
              id="commitment-checkout"
              hidden
              disabled
            >
              Continue to annual membership
            </button>
            <button type="button" class="btn btn--secondary" id="commitment-back">
              Back
            </button>
          </div>
        </div>
      </main>
    </div>

    <script src="commitment-visual-harness.js" defer></script>
  </body>
</html>

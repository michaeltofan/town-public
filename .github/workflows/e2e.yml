name: E2E

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_production:
        description: "Deploy to production (requires explicit GO — leave false to just run tests/staging)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  smoke-and-e2e:
    runs-on: ubuntu-latest
    # Chromium --with-deps regularly exceeds 20m on cold runners; keep headroom
    # so a hung browser install does not cancel after static smoke already passed.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Static smoke
        run: |
          node scripts/test-api-base.js
          node scripts/test-auth-input-module.js
          node scripts/test-account-enrollment-e2e.js
          node scripts/test-build-identity.js
          node scripts/test-security-headers-config.js
          node scripts/test-member-local-feed.js
          node scripts/test-platform-console.js
          node scripts/test-owner-participate-preview.js
          node scripts/test-etapa3-member-journey.js
          node scripts/test-password-passkey-contract.js
          node scripts/test-public-auth-signin.js
          bash scripts/check-membership-recovery.sh
          node scripts/test-profile-session-billing.js
          node scripts/test-see-too-active-all-roles.js
          node scripts/test-see-too-signin-continuity.js
          node scripts/test-community-commitment.js
          node scripts/test-member-signal-create.js
          node scripts/test-madrid-pilot-host.js
          node scripts/test-madrid-pilot-intro.js
          node scripts/test-madrid-discussion-guide.js
          node scripts/test-member-chat-welcome.js
          node scripts/test-feed-deep-link.js
          node scripts/test-spanish-localization.js
          node scripts/test-french-localization.js
          node scripts/test-hungarian-localization.js
          node scripts/test-onboarding-language-continuity.js
          node scripts/test-public-feed-i18n.js
          node scripts/supervise-madrid-pilot.js --offline --skip-units
      - name: Install E2E deps
        working-directory: e2e
        run: npm ci
      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Start candidate site
        run: |
          python3 -m http.server 8080 > /tmp/town-public-http.log 2>&1 &
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8080/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/town-public-http.log
          exit 1
      - name: Candidate public product E2E against staging API
        working-directory: e2e
        env:
          TOWN_PUBLIC_BASE_URL: http://127.0.0.1:8080
        run: npx playwright test feed-live.spec.js member-nav.spec.js account-enrollment-recovery.spec.js
      - name: Platform login E2E
        working-directory: e2e
        env:
          TOWN_PUBLIC_BASE_URL: https://towncivic.org
          TOWN_PLATFORM_EMAIL: ${{ secrets.TOWN_PLATFORM_EMAIL }}
          TOWN_PLATFORM_PASSWORD: ${{ secrets.TOWN_PLATFORM_PASSWORD }}
        run: npx playwright test platform-login.spec.js

  staging-account-enrollment:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: smoke-and-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Validate enrollment secret pair
        id: enrollment-secrets
        env:
          TOWN_E2E_EMAIL_BASE: ${{ secrets.TOWN_E2E_EMAIL_BASE }}
          TOWN_RESEND_API_KEY: ${{ secrets.TOWN_RESEND_API_KEY }}
        run: |
          if [[ -z "$TOWN_E2E_EMAIL_BASE" && -z "$TOWN_RESEND_API_KEY" ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Staging enrollment test is ready; configure both repository secrets to run it."
            exit 0
          fi
          if [[ -z "$TOWN_E2E_EMAIL_BASE" || -z "$TOWN_RESEND_API_KEY" ]]; then
            echo "::error::Configure both TOWN_E2E_EMAIL_BASE and TOWN_RESEND_API_KEY."
            exit 1
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"
      - name: Install E2E deps
        if: steps.enrollment-secrets.outputs.available == 'true'
        working-directory: e2e
        run: npm ci
      - name: Install Chromium
        if: steps.enrollment-secrets.outputs.available == 'true'
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Full staging enrollment E2E
        if: steps.enrollment-secrets.outputs.available == 'true'
        working-directory: e2e
        env:
          TOWN_PUBLIC_BASE_URL: https://towncivic.org
          TOWN_E2E_EMAIL_BASE: ${{ secrets.TOWN_E2E_EMAIL_BASE }}
          TOWN_RESEND_API_KEY: ${{ secrets.TOWN_RESEND_API_KEY }}
        run: npx playwright test account-enrollment.spec.js

      # Video is on for this spec only (see account-enrollment.spec.js) so
      # Mihail gets one real recording of the full member journey against
      # live Staging: invite -> membership -> account -> email -> code ->
      # password -> passkey registration -> passkey auth -> session ->
      # community-commitment. Runs only on manual dispatch, so this never
      # adds overhead to push/PR CI.
      #
      # Pushed to a dedicated branch instead of uploaded as a workflow
      # artifact: Actions artifacts are only downloadable via a signed
      # Azure Blob Storage redirect, which some network/AV policies flag or
      # block outright. A plain git-hosted file has no such friction.
      - name: Publish enrollment journey video to a review branch
        if: steps.enrollment-secrets.outputs.available == 'true' && always()
        run: |
          VIDEO=$(find e2e/test-results -name '*.webm' | head -n1)
          if [[ -z "$VIDEO" ]]; then
            echo "::warning::No enrollment video was produced; nothing to publish."
            exit 0
          fi
          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          DEST="staging-account-enrollment-${STAMP}.webm"
          cp "$VIDEO" "/tmp/${DEST}"
          git config user.name "town-ci"
          git config user.email "town-ci@users.noreply.github.com"
          git checkout --orphan review/staging-account-enrollment-video
          git rm -rf . > /dev/null 2>&1 || true
          cp "/tmp/${DEST}" "${DEST}"
          git add "${DEST}"
          git commit -m "Staging account enrollment journey video (${STAMP})"
          git push origin "HEAD:refs/heads/review/staging-account-enrollment-video" --force

  deploy-staging:
    name: Deploy to staging (Railway)
    needs: smoke-and-e2e
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    concurrency:
      group: deploy-town-public-staging
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write public build identity
        env:
          TOWN_BUILD_ENVIRONMENT: staging
          TOWN_BUILD_SHA: ${{ github.sha }}
          TOWN_BUILD_REPOSITORY: ${{ github.repository }}
          TOWN_BUILD_RUN_ID: ${{ github.run_id }}
        run: |
          # build-identity-writer-begin
          node <<'NODE'
          const fs = require("fs");
          const commit = process.env.TOWN_BUILD_SHA || "";
          const environment = process.env.TOWN_BUILD_ENVIRONMENT || "";
          const repository = process.env.TOWN_BUILD_REPOSITORY || "";
          const workflowRunId = process.env.TOWN_BUILD_RUN_ID || "";
          if (!/^[0-9a-f]{40}$/.test(commit)) throw new Error("invalid build SHA");
          if (!new Set(["staging", "production"]).has(environment)) throw new Error("invalid environment");
          if (repository !== "michaeltofan/town-public") throw new Error("invalid repository");
          if (!/^\d+$/.test(workflowRunId)) throw new Error("invalid workflow run id");
          fs.writeFileSync("build-identity.json", JSON.stringify({
            service: "town-public",
            environment,
            repository,
            commit,
            workflowRunId,
            builtAt: new Date().toISOString()
          }, null, 2) + "\n", { encoding: "utf8", mode: 0o644 });
          NODE
          # build-identity-writer-end

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy town-public-staging
        # Attached mode (no --ci): blocks until the deployment reaches a
        # terminal status and exits non-zero on failure, so this job is an
        # honest CI gate rather than a fire-and-forget trigger.
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service town-public-staging

  deploy-production:
    name: Deploy to production (Railway)
    # Deliberately NOT triggered by push, and NOT by a bare workflow_dispatch
    # either: a plain "Run workflow" click (e.g. to re-run the E2E suite
    # against staging) must never deploy production as a side effect. This
    # bit us for real — re-running this workflow via workflow_dispatch to
    # repeat the E2E suite silently redeployed production, because at the
    # time this job only checked the event name. Production now requires
    # the deploy_production input to be explicitly set to true on top of
    # workflow_dispatch, so a human has to opt in on that specific run.
    # smoke-and-e2e reruns fresh in that same manual run since
    # workflow_dispatch isn't filtered out of its trigger, so a production
    # deploy never skips tests.
    needs: smoke-and-e2e
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_production == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: deploy-town-public-production
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write public build identity
        env:
          TOWN_BUILD_ENVIRONMENT: production
          TOWN_BUILD_SHA: ${{ github.sha }}
          TOWN_BUILD_REPOSITORY: ${{ github.repository }}
          TOWN_BUILD_RUN_ID: ${{ github.run_id }}
        run: |
          # build-identity-writer-begin
          node <<'NODE'
          const fs = require("fs");
          const commit = process.env.TOWN_BUILD_SHA || "";
          const environment = process.env.TOWN_BUILD_ENVIRONMENT || "";
          const repository = process.env.TOWN_BUILD_REPOSITORY || "";
          const workflowRunId = process.env.TOWN_BUILD_RUN_ID || "";
          if (!/^[0-9a-f]{40}$/.test(commit)) throw new Error("invalid build SHA");
          if (!new Set(["staging", "production"]).has(environment)) throw new Error("invalid environment");
          if (repository !== "michaeltofan/town-public") throw new Error("invalid repository");
          if (!/^\d+$/.test(workflowRunId)) throw new Error("invalid workflow run id");
          fs.writeFileSync("build-identity.json", JSON.stringify({
            service: "town-public",
            environment,
            repository,
            commit,
            workflowRunId,
            builtAt: new Date().toISOString()
          }, null, 2) + "\n", { encoding: "utf8", mode: 0o644 });
          NODE
          # build-identity-writer-end

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy town-public (production)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service town-public

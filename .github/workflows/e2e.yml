name: E2E

on:
  pull_request:
  push:
    branches: [main]

jobs:
  smoke-and-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Static smoke
        run: npm run test:smoke
      - name: Feed live E2E
        env:
          TOWN_PUBLIC_BASE_URL: https://towncivic.org
        run: npx playwright test e2e/feed-live.spec.js
      - name: Platform login E2E
        if: ${{ secrets.TOWN_PLATFORM_EMAIL != '' && secrets.TOWN_PLATFORM_PASSWORD != '' }}
        env:
          TOWN_PUBLIC_BASE_URL: https://towncivic.org
          TOWN_PLATFORM_EMAIL: ${{ secrets.TOWN_PLATFORM_EMAIL }}
          TOWN_PLATFORM_PASSWORD: ${{ secrets.TOWN_PLATFORM_PASSWORD }}
        run: npx playwright test e2e/platform-login.spec.js
